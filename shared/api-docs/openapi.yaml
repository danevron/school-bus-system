openapi: 3.0.3
info:
  title: School Bus System API
  version: 1.0.0
  description: API specification for the School Bus System.
servers:
  - url: https://api.schoolbus.com/api
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  service:
                    type: string
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: User registered
  /auth/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /auth/profile:
    get:
      summary: Get authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
  /lines:
    get:
      summary: Get all lines
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Line'
    post:
      summary: Create a new line
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
      responses:
        '201':
          description: Line created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}:
    get:
      summary: Get line by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Line details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    put:
      summary: Update a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
      responses:
        '200':
          description: Line updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    delete:
      summary: Delete a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Line deleted
  /lines/{id}/assign-students:
    post:
      summary: Assign students to a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Students assigned
  /lines/{id}/students:
    post:
      summary: Add a student to a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
      responses:
        '200':
          description: Student added
  /lines/{id}/students/{studentId}:
    delete:
      summary: Remove a student from a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Student removed
  /lines/driver/my-lines:
    get:
      summary: Get lines assigned to the authenticated driver
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of lines for driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Line'
  /lines/{id}/route:
    put:
      summary: Update line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteData'
      responses:
        '200':
          description: Line route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    delete:
      summary: Remove line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Line route removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}/route/stops:
    post:
      summary: Add stop to line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stop:
                  $ref: '#/components/schemas/Stop'
      responses:
        '201':
          description: Stop added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    put:
      summary: Update line route stops (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stops:
                  type: array
                  items:
                    $ref: '#/components/schemas/Stop'
      responses:
        '200':
          description: Line route stops updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}/route/stops/{stopIndex}:
    delete:
      summary: Delete stop from line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: stopIndex
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stop deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /vehicles:
    get:
      summary: Get all vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of vehicles
    post:
      summary: Create a new vehicle (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '201':
          description: Vehicle created
  /vehicles/{id}:
    get:
      summary: Get vehicle by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vehicle details
    put:
      summary: Update vehicle (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '200':
          description: Vehicle updated
    delete:
      summary: Delete vehicle (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Vehicle deleted
  /auth/users:
    get:
      summary: Get all users (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /auth/students:
    post:
      summary: Create a new student (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreation'
      responses:
        '201':
          description: Student created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/students/with-parents:
    get:
      summary: Get students with parent information (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of students with parent info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentWithParents'
  /auth/students/connect-parents:
    post:
      summary: Connect student to parents (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
                parentIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Student connected to parents successfully
  /lines/{id}/activate:
    post:
      summary: Activate a line (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Line activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}/student-assignments:
    post:
      summary: Assign student to line with pickup/dropoff stops (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentAssignment'
      responses:
        '201':
          description: Student assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    get:
      summary: Get student assignments for a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of student assignments for the line
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentAssignment'
  /lines/{id}/student-assignments/{assignmentId}:
    put:
      summary: Update student assignment (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentAssignment'
      responses:
        '200':
          description: Student assignment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    delete:
      summary: Remove student assignment (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student assignment removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}/stop-usage:
    get:
      summary: Get stop usage information for a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stop usage information
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopUsage:
                    type: array
                    items:
                      type: object
                      properties:
                        stopIndex:
                          type: integer
                        pickupCount:
                          type: integer
                        dropoffCount:
                          type: integer
  /rides:
    get:
      summary: Get all rides (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'
    post:
      summary: Create a new ride (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreation'
      responses:
        '201':
          description: Ride created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
  /rides/{id}:
    get:
      summary: Get ride by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
    put:
      summary: Update ride (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideUpdate'
      responses:
        '200':
          description: Ride updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
    delete:
      summary: Delete ride (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Ride deleted successfully
  /rides/driver/my-rides:
    get:
      summary: Get rides assigned to the authenticated driver
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of rides for driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'
  /rides/{id}/start:
    post:
      summary: Start a ride (driver only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
  /rides/{id}/end:
    post:
      summary: End a ride (driver only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride ended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
  /bookings:
    get:
      summary: Get all bookings (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      summary: Create a new booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreation'
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{id}:
    get:
      summary: Get booking by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{id}/confirm:
    post:
      summary: Confirm a booking (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{id}/admit:
    post:
      summary: Admit waiting list booking (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Waiting list booking admitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{id}/cancel:
    post:
      summary: Cancel a booking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{id}/checkin:
    post:
      summary: Check in passenger for a booking (driver only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Passenger checked in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{id}/dropoff:
    post:
      summary: Drop off passenger for a booking (driver only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Passenger dropped off successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/ride/{rideId}:
    get:
      summary: Get all bookings for a specific ride
      security:
        - bearerAuth: []
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of bookings for the ride
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
  /bookings/user/{userId}:
    get:
      summary: Get all bookings for a specific user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of bookings for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
  /invitations:
    get:
      summary: Get all invitations (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
    post:
      summary: Send invitation to user (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreation'
      responses:
        '201':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
  /invitations/{id}:
    delete:
      summary: Delete invitation (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Invitation deleted successfully
  /invitations/token/{token}:
    get:
      summary: Get invitation by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
  /invitations/accept/{token}:
    post:
      summary: Accept invitation by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      responses:
        '200':
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Stop:
      type: object
      required:
        - name
        - address
        - coordinates
        - estimatedTime
        - type
      properties:
        name:
          type: string
          description: Name of the stop
        address:
          type: string
          description: Full address of the stop
        coordinates:
          type: object
          required:
            - latitude
            - longitude
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
        estimatedTime:
          type: number
          minimum: 0
          description: Estimated time to reach this stop (in minutes)
        type:
          type: string
          enum: [pickup, dropoff]
          description: Type of stop
    RouteData:
      type: object
      required:
        - name
        - stops
        - totalDistance
        - estimatedDuration
      properties:
        name:
          type: string
          description: Name of the route
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
          description: List of stops on the route
        totalDistance:
          type: number
          minimum: 0
          description: Total distance of the route (in km)
        estimatedDuration:
          type: number
          minimum: 0
          description: Estimated duration of the route (in minutes)
    Schedule:
      type: object
      required:
        - type
        - startDate
      properties:
        type:
          type: string
          enum: [daily, weekdays, weekends, custom]
          description: Type of schedule
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Days of the week (0=Sunday, 6=Saturday)
        customDates:
          type: array
          items:
            type: string
            format: date
          description: Custom dates for custom schedule type
        startDate:
          type: string
          format: date
          description: Start date of the schedule
        endDate:
          type: string
          format: date
          description: End date of the schedule
    Line:
      type: object
      required:
        - name
        - driver
        - vehicle
        - schedule
      properties:
        _id:
          type: string
          description: Unique identifier for the line
        name:
          type: string
          description: Name of the line
        description:
          type: string
          description: Description of the line
        route:
          $ref: '#/components/schemas/RouteData'
          description: Embedded route data for the line
        driver:
          type: string
          description: ID of the assigned driver
        vehicle:
          type: string
          description: ID of the assigned vehicle
        schedule:
          $ref: '#/components/schemas/Schedule'
          description: Schedule for the line
        maxCapacity:
          type: integer
          minimum: 1
          description: Maximum capacity of the line
        currentCapacity:
          type: integer
          minimum: 0
          description: Current number of assigned students
