openapi: 3.0.3
info:
  title: School Bus System API
  version: 1.0.0
  description: API specification for the School Bus System.
servers:
  - url: https://api.schoolbus.com/api
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  service:
                    type: string
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: User registered
  /auth/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /auth/profile:
    get:
      summary: Get authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
  /lines:
    get:
      summary: Get all lines
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Line'
    post:
      summary: Create a new line
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
      responses:
        '201':
          description: Line created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}:
    get:
      summary: Get line by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Line details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    put:
      summary: Update a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
      responses:
        '200':
          description: Line updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    delete:
      summary: Delete a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Line deleted
  /lines/{id}/assign-students:
    post:
      summary: Assign students to a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Students assigned
  /lines/{id}/students:
    post:
      summary: Add a student to a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
      responses:
        '200':
          description: Student added
  /lines/{id}/students/{studentId}:
    delete:
      summary: Remove a student from a line
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student removed
  /lines/driver/my-lines:
    get:
      summary: Get lines assigned to the authenticated driver
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of lines for driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Line'
  /bookings:
    get:
      summary: Get all bookings (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of bookings
    post:
      summary: Create a booking (parent only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '201':
          description: Booking created
  /bookings/{id}:
    get:
      summary: Get booking by ID (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking details
    put:
      summary: Update booking (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking updated
  /bookings/parent/my-bookings:
    get:
      summary: Get bookings for authenticated parent
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of bookings for parent
  /bookings/line/{lineId}:
    get:
      summary: Get bookings for a specific line
      security:
        - bearerAuth: []
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of bookings for line
  /lines/{id}/route:
    put:
      summary: Update line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteData'
      responses:
        '200':
          description: Line route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    delete:
      summary: Remove line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Line route removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}/route/stops:
    post:
      summary: Add stop to line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stop:
                  $ref: '#/components/schemas/Stop'
      responses:
        '201':
          description: Stop added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
    put:
      summary: Update line route stops (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stops:
                  type: array
                  items:
                    $ref: '#/components/schemas/Stop'
      responses:
        '200':
          description: Line route stops updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /lines/{id}/route/stops/{stopIndex}:
    delete:
      summary: Delete stop from line route (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: stopIndex
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stop deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
  /vehicles:
    get:
      summary: Get all vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of vehicles
    post:
      summary: Create a new vehicle (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '201':
          description: Vehicle created
  /vehicles/{id}:
    get:
      summary: Get vehicle by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vehicle details
    put:
      summary: Update vehicle (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '200':
          description: Vehicle updated
    delete:
      summary: Delete vehicle (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Vehicle deleted
  /rides:
    post:
      summary: Generate rides (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Rides generated
    get:
      summary: Get all rides (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of rides
  /rides/{id}:
    get:
      summary: Get ride by ID (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ride details
    put:
      summary: Update ride status (admin or driver)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Ride status updated
  /rides/{rideId}/guests:
    post:
      summary: Add guest student to ride (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
      responses:
        '200':
          description: Guest student added
  /rides/driver/my-rides:
    get:
      summary: Get rides for authenticated driver
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of rides for driver
  /rides/student/my-rides:
    get:
      summary: Get rides for authenticated student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of rides for student
  /rides/{rideId}/students/{studentId}:
    delete:
      summary: Remove student from ride (parent only)
      security:
        - bearerAuth: []
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student removed from ride
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Stop:
      type: object
      required:
        - name
        - address
        - coordinates
        - estimatedTime
        - type
      properties:
        name:
          type: string
          description: Name of the stop
        address:
          type: string
          description: Full address of the stop
        coordinates:
          type: object
          required:
            - latitude
            - longitude
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
        estimatedTime:
          type: number
          minimum: 0
          description: Estimated time to reach this stop (in minutes)
        type:
          type: string
          enum: [pickup, dropoff]
          description: Type of stop
    RouteData:
      type: object
      required:
        - name
        - stops
        - totalDistance
        - estimatedDuration
      properties:
        name:
          type: string
          description: Name of the route
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
          description: List of stops on the route
        totalDistance:
          type: number
          minimum: 0
          description: Total distance of the route (in km)
        estimatedDuration:
          type: number
          minimum: 0
          description: Estimated duration of the route (in minutes)
    Schedule:
      type: object
      required:
        - type
        - startDate
      properties:
        type:
          type: string
          enum: [daily, weekdays, weekends, custom]
          description: Type of schedule
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Days of the week (0=Sunday, 6=Saturday)
        customDates:
          type: array
          items:
            type: string
            format: date
          description: Custom dates for custom schedule type
        startDate:
          type: string
          format: date
          description: Start date of the schedule
        endDate:
          type: string
          format: date
          description: End date of the schedule
    Line:
      type: object
      required:
        - name
        - driver
        - vehicle
        - schedule
      properties:
        _id:
          type: string
          description: Unique identifier for the line
        name:
          type: string
          description: Name of the line
        description:
          type: string
          description: Description of the line
        route:
          $ref: '#/components/schemas/RouteData'
          description: Embedded route data for the line
        driver:
          type: string
          description: ID of the assigned driver
        vehicle:
          type: string
          description: ID of the assigned vehicle
        schedule:
          $ref: '#/components/schemas/Schedule'
          description: Schedule for the line
        maxCapacity:
          type: integer
          minimum: 1
          description: Maximum capacity of the line
        currentCapacity:
          type: integer
          minimum: 0
          description: Current number of assigned students
        students:
          type: array
          items:
            type: string
          description: List of assigned student IDs
        isActive:
          type: boolean
          default: true
          description: Whether the line is active
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    Vehicle:
      type: object
      required:
        - licensePlate
        - make
        - vehicleModel
        - year
        - capacity
      properties:
        _id:
          type: string
        licensePlate:
          type: string
        make:
          type: string
        vehicleModel:
          type: string
        year:
          type: integer
        capacity:
          type: integer
          minimum: 1
        isActive:
          type: boolean
          default: true
        lastMaintenance:
          type: string
          format: date-time
    Booking:
      type: object
      required:
        - student
        - line
        - date
        - pickupStop
        - dropoffStop
      properties:
        _id:
          type: string
        student:
          type: string
        line:
          type: string
        date:
          type: string
          format: date
        pickupStop:
          type: string
        dropoffStop:
          type: string
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
          default: pending
        notes:
          type: string