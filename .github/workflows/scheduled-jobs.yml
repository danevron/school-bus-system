name: Scheduled Jobs

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Jobs API Health
        run: |
          echo "🚌 Checking School Bus Jobs API..."
          echo "Current time: $(date -u)"
          
          # Health check (replace with your actual Render URL)
          curl -f -X GET "${{ secrets.API_BASE_URL }}/api/jobs/health" \
            -H "Accept: application/json" \
            || echo "Health check failed - service might be sleeping"

  trigger-scheduled-job:
    runs-on: ubuntu-latest
    needs: health-check
    
    steps:
      - name: Trigger Scheduled Job
        run: |
          echo "🚌 Triggering test job via API..."

          response=$(curl -s -X POST "${{ secrets.API_BASE_URL }}/api/jobs/test" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json")
          
          echo "API Response: $response"
          
          # Check if the response indicates success
          if echo "$response" | grep -q "Test job completed successfully"; then
            echo "✅ Test job completed successfully!"
          else
            echo "❌ Test job failed!"
            exit 1
          fi